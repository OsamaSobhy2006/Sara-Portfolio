<section id="projects" class="section projects-section">
  <div class="container">

    <div class="section-heading reveal">
      <span class="section-tag">
        {{ site.nav.projects }}
      </span>

      <h3>
        {{ site.projects.heading }}
      </h3>
    </div>

    <div class="projects-grid">
      <article
        *ngFor="let project of site.projects.items"
        class="project-card"
      >
        <div
          class="project-media"
          [style.background-image]="'url(' + project.image + ')'"
        >
          <span class="project-tech">
            {{ project.technology }}
          </span>
        </div>

        <div class="project-body">
          <h4>
            {{ project.title }}
          </h4>

          <p>
            {{ project.description }}
          </p>

          <div class="tag-list">
            <span *ngFor="let tag of project.tags">
              {{ tag }}
            </span>
          </div>

          <button
            type="button"
            class="btn btn-primary project-button"
            (click)="openProject(project)"
          >
            {{ site.projects.button }}
          </button>
        </div>
      </article>
    </div>

  </div>
</section>
